name: Feature request
description: Propose an enhancement or new capability for PrimeUnits
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the gap or pain point, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true

  - type: textarea
    id: taxonomy
    attributes:
      label: Category / classification impact
      description: >
        If this touches categories, classifications, spec fields, brands, or
        search/filter behavior, describe how it fits the existing
        Category → Classification → Spec Field model (see CONTRIBUTING.md).
        Leave blank if not applicable.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
